<!DOCTYPE html>
<html lang='pt-br'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Aquário - Notícias</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eaf6fb; margin: 0; padding: 0; }
        .container { max-width: 800px; margin: 40px auto; background: #fff; box-shadow: 0 2px 8px #b3c6e6; border-radius: 8px; padding: 32px; }
        h1 { text-align: center; color: #153e75; margin-bottom: 32px; } /* azul marinho */
        .noticia { margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid #b3c6e6; }
        .noticia h2 { color: #2188b6; margin: 0 0 8px 0; } /* azul suave próximo ao ciano */
        .noticia p { color: #3a5a7a; margin: 4px 0; }
        .autor { font-size: 0.95em; color: #2188b6; }
    </style>
</head>
<body>
    <div class='container'>
        <h1>Sistema Aquário</h1>
        <div class='noticia'>
            <h2>gustavo esta namorando henrique baltar</h2>
            <p class='autor'><strong>Autor:</strong> segundo</p>
            <p>sim</p>
        </div>
        <div class='noticia'>
            <h2>dfvsdvd</h2>
            <p class='autor'><strong>Autor:</strong> vdvdsv</p>
            <p>dvvdvs</p>
        </div>
        <div class='noticia'>
            <h2>1231231</h2>
            <p class='autor'><strong>Autor:</strong> sdfas</p>
            <p>asdasd</p>
        </div>
    </div>
</body>
</html>
